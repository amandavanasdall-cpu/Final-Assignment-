<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Spending Survey</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Healthcare Spending Survey</h1>

        <p>Please enter your information below.</p>

        <form method="POST">

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="1" required>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Other">Other</option>
            </select>

            <label for="income">Total Income:</label>
            <input type="number" id="income" name="income" min="0" step="0.01" required>

            <h2>Monthly Expenses</h2>

            <div class="expense">
                <label>
                    <input type="checkbox" name="utilities_check">
                    Utilities
                </label>
                <input type="number" name="utilities" min="0" step="0.01" placeholder="Amount spent">
            </div>

            <div class="expense">
                <label>
                    <input type="checkbox" name="entertainment_check">
                    Entertainment
                </label>
                <input type="number" name="entertainment" min="0" step="0.01" placeholder="Amount spent">
            </div>

            <div class="expense">
                <label>
                    <input type="checkbox" name="school_fees_check">
                    School Fees
                </label>
                <input type="number" name="school_fees" min="0" step="0.01" placeholder="Amount spent">
            </div>

            <div class="expense">
                <label>
                    <input type="checkbox" name="shopping_check">
                    Shopping
                </label>
                <input type="number" name="shopping" min="0" step="0.01" placeholder="Amount spent">
            </div>

            <div class="expense">
                <label>
                    <input type="checkbox" name="healthcare_check">
                    Healthcare
                </label>
                <input type="number" name="healthcare" min="0" step="0.01" placeholder="Amount spent">
            </div>

            <button type="submit">Submit Survey</button>

        </form>

    </div>

</body>
</html>
